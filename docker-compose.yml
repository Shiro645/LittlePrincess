# LittlePrincess — Guardian Tales Discord bot
#
#   1. cp .env.example .env   then fill in the values
#   2. docker compose up -d
#   3. docker compose logs -f bot
#
# Folders created next to this file:
#   ./config  -> config.json (every game value, created on first start,
#                editable from Discord with /config panneau)
#   ./data    -> SQLite database + hero cache (back it up)

services:
  bot:
    image: ghcr.io/shiro645/littleprincess:latest
    # To build the image from source instead of pulling it,
    # comment out the "image" line above and uncomment the next line:
    # build: .
    container_name: littleprincess
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Paris
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    labels:
      # Only this container is updated by Watchtower
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Updates the bot when /bot update is used on Discord
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: littleprincess-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Europe/Paris
      # Update on demand only (HTTP API), no periodic polling
      WATCHTOWER_HTTP_API_ENDPOINTS: "update"
      WATCHTOWER_HTTP_API_UPDATE: "true"        # legacy option name, kept for compatibility
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN}
      # Only watch containers labelled watchtower.enable=true
      WATCHTOWER_LABEL_ENABLE: "true"
      # Remove the old image after an update
      WATCHTOWER_CLEANUP: "true"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
