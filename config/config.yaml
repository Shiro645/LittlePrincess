# =============================================================================
#  LittlePrincess — configuration du bot
# =============================================================================
#  Toutes les valeurs du jeu sont ici. Après une modification :
#    - soit `/bot recharger` sur Discord (prise en compte immédiate),
#    - soit `docker compose restart bot`.
#
#  Les secrets (token Discord, token API gtales.top…) ne vont PAS ici mais
#  dans le fichier .env.
#
#  Astuce : un ID Discord (salon, rôle, membre) s'obtient en activant le mode
#  développeur (Paramètres > Avancés) puis clic droit > « Copier l'identifiant ».
#  0 = désactivé / non configuré.
# =============================================================================

general:
  timezone: "Europe/Paris"
  # Nom affiché dans les messages du bot
  bot_name: "LittlePrincess"
  # Couleur principale des embeds (hexadécimal)
  embed_color: "#F5A9D0"

# -----------------------------------------------------------------------------
#  Salons et rôles
# -----------------------------------------------------------------------------
channels:
  # Annonce des nouveautés après chaque mise à jour du bot
  announcements: 0
  # Alertes réservées au staff (nouvelle version disponible, erreurs de synchro…)
  admin: 0
  # Messages « X passe niveau Y » (0 = dans le salon où le membre a parlé)
  level_up: 0
  # Annonce des succès débloqués (0 = pas d'annonce publique)
  achievements: 0
  # Salon du boss du samedi
  boss: 0
  # Salon où annoncer les victoires du wordle (0 = pas d'annonce)
  wordle: 0
  # Salons où les commandes du bot sont autorisées. Liste vide = partout.
  # Les commandes /admin et /bot fonctionnent partout pour le staff.
  allowed: []
  # Salons où les messages ne rapportent pas d'XP
  xp_excluded: []

roles:
  # Rôles qui ont accès aux commandes /admin et /bot (en plus des administrateurs)
  staff: []
  # Rôle mentionné quand le boss apparaît (0 = pas de mention)
  boss_ping: 0

# -----------------------------------------------------------------------------
#  Données des héros (API Guardian Tales TOP — https://gtales.top)
# -----------------------------------------------------------------------------
gamedata:
  api_base_url: "https://gtales.top"
  # Le token se met dans .env (GTALES_API_TOKEN)
  # Resynchronisation automatique si le cache est plus vieux que N jours
  sync_interval_days: 7
  # Pause entre deux requêtes à l'API (secondes) pour ne pas la surcharger
  request_delay_seconds: 0.4
  # Version utilisée pour les stats : "Base" (ou "Myth" si tu veux les versions Mythe)
  variant: "Base"
  # Clés de héros à exclure du jeu (ex. ["119"])
  exclude_heroes: []
  # Si non vide : seuls ces héros sont dans le jeu
  include_only: []
  # Type d'arme par défaut si l'API n'en donne pas, selon le rôle
  default_weapon_by_role:
    warrior: "sword_1h"
    tank: "sword_1h"
    ranged: "bow"
    support: "staff"

# -----------------------------------------------------------------------------
#  Joueurs & monnaies
# -----------------------------------------------------------------------------
economy:
  # Ce que reçoit un nouveau joueur
  start_gems: 3000
  start_gold: 5000

# -----------------------------------------------------------------------------
#  Invocations (gacha)
# -----------------------------------------------------------------------------
gacha:
  cost_single: 300          # gemmes pour 1 invocation
  cost_ten: 2700            # gemmes pour 10 invocations
  # Taux héros (en %), taux officiels de Guardian Tales
  hero_rates:
    3: 2.75
    2: 19.0
    1: 78.25
  # Taux armes (en %). Les 5★ sont les armes exclusives des héros.
  weapon_rates:
    5: 3.0
    4: 9.0
    3: 16.0
    2: 27.0
    1: 45.0
  # Bannière vedette : part des 3★ (ou 5★ arme) qui sont le héros/l'arme vedette
  featured_share: 0.5
  # Rotation de la bannière vedette (clés de héros 3★, une par semaine, dans l'ordre).
  # Liste vide = un héros 3★ tiré au hasard chaque semaine.
  featured_rotation: []
  # Changement de bannière vedette : jour (0 = lundi … 6 = dimanche) et heure
  featured_change_weekday: 0
  featured_change_hour: 0
  # Pitié : 3★ (héros) / 5★ (arme) garanti si aucun obtenu depuis N invocations
  pity_hero: 80
  pity_weapon: 80
  # Garantie minimum dans une invocation x10 (rareté)
  ten_pull_min_hero_rarity: 2
  ten_pull_min_weapon_rarity: 3
  # Un doublon donne +1★. Au-delà de 5★, il est converti :
  duplicate_conversion:
    hero:
      1: { gems: 5,  gold: 500 }
      2: { gems: 15, gold: 2000 }
      3: { gems: 50, gold: 10000 }
    weapon:
      1: { gems: 2,  gold: 200 }
      2: { gems: 5,  gold: 500 }
      3: { gems: 10, gold: 1500 }
      4: { gems: 20, gold: 4000 }
      5: { gems: 50, gold: 10000 }

# -----------------------------------------------------------------------------
#  Améliorations (niveaux & étoiles) et calcul des stats
# -----------------------------------------------------------------------------
progression:
  star_max: 5
  # Niveau maximum selon les étoiles
  max_level_by_stars: { 1: 20, 2: 40, 3: 60, 4: 80, 5: 100 }
  # Les stats de l'API correspondent à un héros niveau max, 5★.
  # stat = stat_api × facteur_niveau × facteur_étoiles
  # facteur_niveau va de level_factor_min (niveau 1) à 1.0 (niveau 100)
  level_factor_min: 0.20
  level_reference: 100
  star_factor: { 1: 0.60, 2: 0.70, 3: 0.80, 4: 0.90, 5: 1.00 }
  # Coût en or pour passer du niveau L à L+1 : base + mult × L^exposant
  hero_level_cost: { base: 50, mult: 5, exponent: 1.4 }
  weapon_level_cost: { base: 25, mult: 3, exponent: 1.4 }

# -----------------------------------------------------------------------------
#  Armes génériques (1★ à 4★). Les 5★ sont les armes exclusives (API).
# -----------------------------------------------------------------------------
weapons:
  # ATK de base (niveau max, 5★) selon la rareté d'origine des armes génériques
  generic_atk: { 1: 500, 2: 700, 3: 950, 4: 1200 }
  # Bonus quand un héros porte SA propre arme exclusive
  exclusive_bonus:
    atk_pct: 15
    crit_chance: 5
  # Libellés des types d'armes
  type_names:
    sword_1h: "Épée à une main"
    sword_2h: "Épée à deux mains"
    rifle: "Fusil"
    bow: "Arc"
    basket: "Panier"
    staff: "Bâton"
    gauntlet: "Gantelet"
    claw: "Griffe"
  # Noms des armes génériques par type, de 1★ à 4★
  generic_names:
    sword_1h: ["Épée rouillée", "Épée de garde", "Lame du chevalier", "Épée de Kanterbury"]
    sword_2h: ["Espadon émoussé", "Claymore", "Fendoir du vétéran", "Grande épée runique"]
    rifle:    ["Pistolet de fortune", "Fusil de chasse", "Carabine de précision", "Fusil gravé"]
    bow:      ["Arc court", "Arc long", "Arc de l'éclaireur", "Arc du vent"]
    basket:   ["Panier en osier", "Panier de pique-nique", "Panier enchanté", "Panier des fées"]
    staff:    ["Bâton noueux", "Bâton d'apprenti", "Sceptre arcanique", "Bâton de l'archimage"]
    gauntlet: ["Gants de cuir", "Gantelets de fer", "Poings d'acier", "Gantelets du titan"]
    claw:     ["Griffes usées", "Griffes acérées", "Griffes du prédateur", "Griffes de l'ombre"]

# -----------------------------------------------------------------------------
#  Combat (colisée, boss, dummy)
# -----------------------------------------------------------------------------
combat:
  team_size: 4                  # 1 à 4 héros ; le 1er héros de l'équipe est le leader
  # Multiplicateur d'avantage / désavantage élémentaire
  element_advantage: 1.30
  element_disadvantage: 0.70
  # Feu > Terre > Eau > Feu ; Lumière <-> Ténèbres ; Basique neutre
  element_chart:
    fire: [earth]
    earth: [water]
    water: [fire]
    light: [dark]
    dark: [light]
    basic: []
  # Réduction de dégâts par la DEF : def / (def + def_constant)
  def_constant: 1000
  base_crit_chance: 5           # %
  base_crit_multiplier: 1.5
  damage_variance: 0.05         # ±5 % de dégâts aléatoires
  normal_attack_multiplier: 1.0
  # Compétence d'arme : multiplicateur par défaut si l'API n'en donne pas
  default_skill_multiplier: 2.5
  # Les recharges de l'API sont en secondes : 1 tour = N secondes
  seconds_per_turn: 4
  min_skill_cooldown_turns: 2
  # Recharge au début du combat : "random" (aléatoire, évite que tout le monde
  # lance sa compétence au 1er tour) ou un nombre de tours
  initial_skill_cooldown: "random"
  # Compétence de chaîne
  default_chain_multiplier: 3.0
  chain_combo_bonus: 0.10       # +10 % de dégâts par maillon de chaîne
  # États : une cible À terre / Projetée a X % de chances de perdre son tour
  cc_skip_chance: 0.30
  # Les tanks attirent les coups : probabilité qu'un ennemi cible un tank vivant
  tank_taunt_chance: 0.60
  # Soutiens : soignent un allié sous X % de PV (soin = stat Soin × multiplicateur)
  support_heal_threshold: 0.60
  heal_multiplier: 6.0
  # Le buff d'équipe du leader est multiplié par :
  leader_party_buff_multiplier: 1.5
  # Boss — action « Attaque » : attaque normale renforcée (mais pas de compétence)
  focus_attack_multiplier: 1.3
  # Boss — action « Garde » : réduction des dégâts subis pendant le tour
  guard_reduction: 0.50
  # Les PV sont multipliés selon le mode (pour des combats de durée raisonnable)
  hp_multiplier:
    duel: 0.50
    boss: 1.0
    dummy: 1.0
  max_rounds_duel: 30

# -----------------------------------------------------------------------------
#  Progression du compte (XP Discord)
# -----------------------------------------------------------------------------
leveling:
  message_xp_min: 15
  message_xp_max: 25
  message_cooldown_seconds: 60
  # Un peu d'or à chaque message qui rapporte de l'XP
  message_gold: 5
  reaction_xp: 3
  reaction_cooldown_seconds: 30
  reaction_daily_cap: 60        # XP max par jour via les réactions
  # XP pour passer du niveau L à L+1 : a×L² + b×L + c
  xp_curve: { a: 5, b: 50, c: 100 }
  # Récompense à chaque niveau
  reward_per_level: { gems: 100, gold: 1000 }
  # Bonus tous les N niveaux
  milestone_every: 5
  milestone_reward: { gems: 500, gold: 5000 }
  # Rôles donnés automatiquement : niveau -> ID du rôle
  level_roles: {}
  #   10: 123456789012345678
  #   25: 123456789012345678
  # false = le membre ne garde que le rôle de son palier le plus haut
  keep_previous_roles: false
  # Titres débloqués par niveau (affichables sur /profil)
  titles_by_level:
    1: "Novice"
    5: "Aventurier"
    10: "Gardien"
    20: "Chevalier de Kanterbury"
    30: "Champion"
    50: "Héros légendaire"
    75: "Gardien éternel"
  # XP bonus des mini-jeux
  minigame_xp:
    wordle_win: 50
    duel: 20
    boss_participation: 100
    dummy: 10

# -----------------------------------------------------------------------------
#  Récompenses quotidiennes
# -----------------------------------------------------------------------------
daily:
  # Reset à cette heure (fuseau general.timezone)
  reset_hour: 0
  # Récompense selon le jour de la série (cycle de 7 jours)
  rewards:
    - { gems: 100, gold: 1500 }
    - { gems: 100, gold: 1500 }
    - { gems: 150, gold: 2000 }
    - { gems: 150, gold: 2000 }
    - { gems: 200, gold: 2500 }
    - { gems: 200, gold: 2500 }
    - { gems: 600, gold: 5000 }    # 7e jour : gros bonus
  # Bonus de série : +X % par cycle de 7 jours complété (plafonné)
  streak_cycle_bonus_pct: 10
  streak_cycle_bonus_max_pct: 50

# -----------------------------------------------------------------------------
#  Missions
# -----------------------------------------------------------------------------
#  Types disponibles : messages, reactions, daily_claim, summon, hero_level_up,
#  wordle_play, wordle_win, duel, duel_win, dummy, boss_participation,
#  shop_purchase, gift
missions:
  daily_count: 3          # nombre de missions quotidiennes tirées chaque jour
  weekly_count: 3
  daily_pool:
    - { id: d_msg,     type: messages,      target: 20, name: "Discuter (20 messages)",           reward: { gems: 60,  gold: 800 } }
    - { id: d_react,   type: reactions,     target: 5,  name: "Réagir à 5 messages",              reward: { gems: 30,  gold: 500 } }
    - { id: d_daily,   type: daily_claim,   target: 1,  name: "Récupérer le /daily",              reward: { gems: 30,  gold: 500 } }
    - { id: d_summon,  type: summon,        target: 1,  name: "Faire 1 invocation",               reward: { gems: 50,  gold: 500 } }
    - { id: d_wordle,  type: wordle_play,   target: 1,  name: "Jouer au wordle du jour",          reward: { gems: 50,  gold: 800 } }
    - { id: d_dummy,   type: dummy,         target: 1,  name: "Tester tes dégâts sur le dummy",   reward: { gems: 40,  gold: 800 } }
    - { id: d_level,   type: hero_level_up, target: 1,  name: "Améliorer un héros",               reward: { gems: 40,  gold: 500 } }
    - { id: d_duel,    type: duel,          target: 1,  name: "Faire un duel au colisée",         reward: { gems: 60,  gold: 1000 } }
  weekly_pool:
    - { id: w_msg,     type: messages,           target: 200, name: "Discuter (200 messages)",       reward: { gems: 400, gold: 6000 } }
    - { id: w_boss,    type: boss_participation, target: 1,   name: "Participer au boss du samedi",  reward: { gems: 500, gold: 8000 } }
    - { id: w_summon,  type: summon,             target: 20,  name: "Faire 20 invocations",          reward: { gems: 300, gold: 5000 } }
    - { id: w_wordle,  type: wordle_win,         target: 5,   name: "Gagner 5 wordles",              reward: { gems: 400, gold: 6000 } }
    - { id: w_duelwin, type: duel_win,           target: 3,   name: "Gagner 3 duels",                reward: { gems: 400, gold: 6000 } }
    - { id: w_level,   type: hero_level_up,      target: 30,  name: "Monter 30 niveaux de héros",    reward: { gems: 300, gold: 4000 } }

# -----------------------------------------------------------------------------
#  Wordle de héros (façon Loldle)
# -----------------------------------------------------------------------------
wordle:
  max_attempts: 8
  # Récompense selon le nombre d'essais (index 0 = trouvé du 1er coup)
  rewards:
    - { gems: 200, gold: 3000 }
    - { gems: 150, gold: 2500 }
    - { gems: 120, gold: 2000 }
    - { gems: 100, gold: 1500 }
    - { gems: 80,  gold: 1200 }
    - { gems: 60,  gold: 1000 }
    - { gems: 50,  gold: 800 }
    - { gems: 40,  gold: 600 }
  # Indice (buff d'équipe du héros) affiché après N essais ratés
  hint_after: 4
  # Change la séquence des héros du jour (mets n'importe quel texte)
  salt: "littleprincess"

# -----------------------------------------------------------------------------
#  Colisée (duels en direct avec mise de gemmes)
# -----------------------------------------------------------------------------
colosseum:
  min_bet: 0
  max_bet: 3000
  # Temps pour accepter un défi (secondes)
  accept_timeout: 120
  max_duels_per_day: 10

# -----------------------------------------------------------------------------
#  Dummy (mannequin de dégâts)
# -----------------------------------------------------------------------------
dummy:
  turns: 10
  defense: 300
  # Seuls les tests sur le mannequin neutre (sans élément) comptent au classement
  leaderboard_size: 10

# -----------------------------------------------------------------------------
#  Boss du samedi
# -----------------------------------------------------------------------------
boss:
  enabled: true
  # Début : jour (0 = lundi … 5 = samedi, 6 = dimanche) et heure
  weekday: 5
  hour: 18
  minute: 0
  # Inscription avant le 1er tour (secondes)
  join_seconds: 300
  # Durée d'un tour : les joueurs choisissent leur action (secondes)
  turn_seconds: 60
  max_turns: 15
  # Action par défaut d'un joueur inscrit qui ne choisit rien :
  # auto (soin si besoin, compétence si prête, sinon attaque), attack, skill, guard
  afk_action: "auto"
  # Crée un fil pour le combat (sinon tout est posté dans le salon)
  use_thread: true
  # PV du boss :
  #  adaptive : chaque participant ajoute (dégâts estimés de son équipe sur
  #             max_turns tours) × difficulty → s'adapte au niveau de la guilde
  #  fixed    : hp_per_participant × nombre de participants
  hp_mode: "adaptive"
  difficulty: 0.80
  hp_per_participant: 300000
  # Rattrapage en solo (pour les absents) jusqu'à : jour + heure
  solo_end_weekday: 6
  solo_end_hour: 23
  solo_end_minute: 59
  solo_turns: 10
  # Récompenses (distribuées à la fin du rattrapage)
  rewards:
    participation: { gems: 300, gold: 5000 }
    # Bonus par rang aux dégâts (1er, 2e, 3e…)
    rank_bonus:
      - { gems: 500, gold: 8000 }
      - { gems: 300, gold: 5000 }
      - { gems: 200, gold: 3000 }
    # Bonus pour tous les participants si le boss est vaincu
    kill_bonus: { gems: 400, gold: 6000 }
  # Liste des boss : un par semaine, dans l'ordre (rotation)
  #  attacks : type single (un héros) ou aoe (tous les héros)
  #            hp_pct : dégâts en % des PV max de la cible (avant élément/garde)
  #            state : downed / airborne / injured (facultatif)
  roster:
    - id: invader_commander
      name: "Commandant des Envahisseurs"
      element: dark
      defense: 600
      description: "Le chef de l'armée des Envahisseurs vient réclamer Kanterbury."
      image: ""
      attacks:
        - { name: "Lame du néant",      type: single, hp_pct: 38, weight: 3 }
        - { name: "Onde obscure",        type: aoe,    hp_pct: 15, weight: 2 }
        - { name: "Charge dévastatrice", type: single, hp_pct: 28, weight: 1, state: downed }
    - id: magma_slime
      name: "Slime de magma géant"
      element: fire
      defense: 400
      description: "Un slime brûlant qui fait fondre tout sur son passage."
      image: ""
      attacks:
        - { name: "Éclaboussure brûlante", type: aoe,    hp_pct: 17, weight: 3 }
        - { name: "Bond écrasant",         type: single, hp_pct: 35, weight: 2, state: airborne }
    - id: forest_guardian
      name: "Gardien de la forêt corrompu"
      element: earth
      defense: 700
      description: "L'esprit de la forêt a été corrompu par les ténèbres."
      image: ""
      attacks:
        - { name: "Racines piégeuses", type: aoe,    hp_pct: 13, weight: 2, state: injured }
        - { name: "Coup de tronc",     type: single, hp_pct: 40, weight: 3 }
    - id: abyssal_kraken
      name: "Kraken des abysses"
      element: water
      defense: 500
      description: "Une créature des profondeurs qui engloutit les navires."
      image: ""
      attacks:
        - { name: "Raz-de-marée", type: aoe,    hp_pct: 16, weight: 3 }
        - { name: "Tentacule",    type: single, hp_pct: 35, weight: 2, state: airborne }
    - id: fallen_archangel
      name: "Archange déchu"
      element: light
      defense: 650
      description: "Un ange tombé qui juge les Gardiens indignes."
      image: ""
      attacks:
        - { name: "Jugement céleste", type: aoe,    hp_pct: 15, weight: 2 }
        - { name: "Lance sacrée",     type: single, hp_pct: 38, weight: 3, state: downed }

# -----------------------------------------------------------------------------
#  Boutique (achats en or ou en gemmes)
# -----------------------------------------------------------------------------
#  Types : gems (gagne des gemmes), hero_ticket, weapon_ticket (tickets
#  d'invocation), star_up (+1★ sur un héros au choix)
#  limit_period : day / week / none
shop:
  items:
    - { id: gems_pack,     name: "Sac de gemmes (100)",         type: gems,          amount: 100, price: { gold: 10000 }, limit: 3, limit_period: day }
    - { id: hero_ticket,   name: "Ticket d'invocation de héros", type: hero_ticket,   amount: 1,   price: { gold: 25000 }, limit: 2, limit_period: week }
    - { id: weapon_ticket, name: "Ticket d'invocation d'arme",   type: weapon_ticket, amount: 1,   price: { gold: 20000 }, limit: 2, limit_period: week }
    - { id: star_crystal,  name: "Cristal d'éveil (+1★ héros)",  type: star_up,       amount: 1,   price: { gems: 6000 },  limit: 1, limit_period: week }

# -----------------------------------------------------------------------------
#  Dons entre joueurs
# -----------------------------------------------------------------------------
gifts:
  enabled: true
  # Montant maximum qu'un joueur peut donner par jour
  daily_cap: { gems: 1000, gold: 50000 }
  # Ancienneté minimale (niveau du compte) pour pouvoir donner
  min_level: 3

# -----------------------------------------------------------------------------
#  Succès
# -----------------------------------------------------------------------------
#  stat : summons, heroes_owned, three_star_pulled, max_hero_stars,
#  max_hero_level, wordle_wins, duel_wins, boss_participations, boss_kills,
#  best_dummy, level, best_streak, gifts_sent, gems_won_duel
achievements:
  - { id: first_summon,  name: "Première invocation",   description: "Faire ta première invocation",         stat: summons,             target: 1,       reward: { gems: 100, gold: 1000 } }
  - { id: summons_100,   name: "Accro au gacha",        description: "Faire 100 invocations",                stat: summons,             target: 100,     reward: { gems: 500, gold: 5000 } }
  - { id: summons_500,   name: "Baleine de Kanterbury", description: "Faire 500 invocations",                stat: summons,             target: 500,     reward: { gems: 1500 }, title: "Baleine" }
  - { id: first_3star,   name: "Étoile filante",        description: "Obtenir un héros 3★ en invocation",    stat: three_star_pulled,   target: 1,       reward: { gems: 300 } }
  - { id: collect_10,    name: "Collectionneur",        description: "Posséder 10 héros différents",         stat: heroes_owned,        target: 10,      reward: { gems: 300, gold: 3000 } }
  - { id: collect_30,    name: "Grand collectionneur",  description: "Posséder 30 héros différents",         stat: heroes_owned,        target: 30,      reward: { gems: 1000 }, title: "Collectionneur" }
  - { id: hero_5star,    name: "Éveil complet",         description: "Monter un héros à 5★",                 stat: max_hero_stars,      target: 5,       reward: { gems: 500 } }
  - { id: hero_lv100,    name: "Au sommet",             description: "Monter un héros au niveau 100",        stat: max_hero_level,      target: 100,     reward: { gems: 1000 }, title: "Maître d'armes" }
  - { id: wordle_1,      name: "Détective",             description: "Gagner un wordle",                     stat: wordle_wins,         target: 1,       reward: { gems: 100 } }
  - { id: wordle_30,     name: "Encyclopédie vivante",  description: "Gagner 30 wordles",                    stat: wordle_wins,         target: 30,      reward: { gems: 1000 }, title: "Encyclopédie" }
  - { id: duel_1,        name: "Premier sang",          description: "Gagner un duel",                       stat: duel_wins,           target: 1,       reward: { gems: 100 } }
  - { id: duel_25,       name: "Gladiateur",            description: "Gagner 25 duels",                      stat: duel_wins,           target: 25,      reward: { gems: 1000 }, title: "Gladiateur" }
  - { id: boss_1,        name: "Chasseur de boss",      description: "Participer à un boss",                 stat: boss_participations, target: 1,       reward: { gems: 200 } }
  - { id: boss_kill,     name: "Tueur de boss",         description: "Vaincre un boss avec la guilde",       stat: boss_kills,          target: 1,       reward: { gems: 500 }, title: "Tueur de boss" }
  - { id: dummy_1m,      name: "Frappe lourde",         description: "Infliger 1 000 000 de dégâts au dummy", stat: best_dummy,         target: 1000000, reward: { gems: 500 } }
